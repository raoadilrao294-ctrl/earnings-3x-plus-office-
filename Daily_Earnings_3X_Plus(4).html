<script>
function setActive(el){document.querySelectorAll(".side-link").forEach(x=>x.classList.remove("active"));if(el)el.classList.add("active")}
document.addEventListener("click",e=>{let m=document.getElementById("siteMenu"),b=document.querySelector(".menu-toggle");if(m&&!m.classList.contains("hidden")&&!m.contains(e.target)&&!b.contains(e.target))m.classList.add("hidden")});
document.addEventListener("DOMContentLoaded",()=>{let d=document.getElementById("todayDate");if(d)d.textContent=new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"})});
const KEY="daily_earnings_3x_plus_v2";
let user=JSON.parse(localStorage.getItem(KEY)||"null");
let requests=JSON.parse(localStorage.getItem(KEY+"_requests")||"[]");
let videos=JSON.parse(localStorage.getItem(KEY+"_videos")||"[]");
function save(){localStorage.setItem(KEY,JSON.stringify(user))}
function saveRequests(){localStorage.setItem(KEY+"_requests",JSON.stringify(requests))}
let ownerAdminUnlocked=false;
function toggleMenu(){document.getElementById("siteMenu").classList.toggle("hidden")}
function goPage(id){show(id);document.getElementById("siteMenu").classList.add("hidden")}
function show(id){if(id==="admin"&&!ownerAdminUnlocked){alert("Admin Panel صرف ویب سائٹ کے مالک کے لیے ہے۔");id="home";}document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));let page=document.getElementById(id);if(page)page.classList.add("active");if(id==="profile")renderProfile();if(id==="dashboard")renderDashboard();if(id==="tasks")renderVideos();if(id==="history"){renderProfile();let h=document.getElementById("historyPage"),src=document.getElementById("historyList");if(h&&src)h.innerHTML=src.innerHTML}if(id==="earnings"){if(user){document.getElementById("eBalance").textContent="Rs. "+Number(user.balance||0).toFixed(2);document.getElementById("eToday").textContent="Rs. 0.00";document.getElementById("eTotal").textContent="Rs. "+Number(user.earnings||0).toFixed(2)}}if(id==="admin"&&document.getElementById("adminTools").classList.contains("hidden")){}else if(id==="admin")renderAdmin();window.scrollTo(0,0)}
function signup(){let n=document.getElementById("name").value.trim(),e=document.getElementById("email").value.trim().toLowerCase(),p=document.getElementById("pass").value,c=document.getElementById("confirm").value;let m=document.getElementById("signupMsg");if(!n||!e||!p||!c){m.textContent="Please complete all fields.";return}if(p!==c){m.textContent="Passwords do not match.";return}user={name:n,email:e,password:p,balance:0,earnings:0,done:[]};save();m.textContent="Account created on this device. Please log in."}
function login(){let m=document.getElementById("loginMsg");if(!user){m.textContent="Please create an account first.";return}if(document.getElementById("lemail").value.trim().toLowerCase()!==user.email||document.getElementById("lpass").value!==user.password){m.textContent="Email or password is incorrect.";return}m.textContent="Login successful.";show("dashboard")}
function fillPlan(){let x=document.getElementById("plan").value;if(x)document.getElementById("damount").value=x}
function previewShot(e){let f=e.target.files[0],img=document.getElementById("shotPreview");if(!f){img.classList.add("hidden");return}let r=new FileReader();r.onload=()=>{img.src=r.result;img.classList.remove("hidden")};r.readAsDataURL(f)}
function compressScreenshot(file){return new Promise((resolve,reject)=>{let reader=new FileReader();reader.onerror=reject;reader.onload=()=>{let img=new Image();img.onerror=reject;img.onload=()=>{let scale=Math.min(1,1100/Math.max(img.width,img.height)),canvas=document.createElement("canvas");canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL("image/jpeg",0.68))};img.src=reader.result};reader.readAsDataURL(file)})}
async function deposit(){let m=document.getElementById("dmsg"),a=Number(document.getElementById("damount").value),ref=document.getElementById("dref").value.trim(),file=document.getElementById("dscreen").files[0];if(!user){m.textContent="Please log in first.";return}if(a<=0||!ref||!file){m.textContent="Enter amount, transaction ID, and screenshot.";return}if(file.size>8*1024*1024){m.textContent="Please select a screenshot smaller than 8 MB.";return}try{m.textContent="Saving your request...";let screenshotData=await compressScreenshot(file);requests.push({type:"Deposit",method:"EasyPaisa",amount:a,reference:ref,screenshotName:file.name,screenshotData,userEmail:user.email,userName:user.name,status:"Pending",date:new Date().toLocaleString()});saveRequests();m.textContent="Deposit request submitted. Please wait for payment verification.";renderDashboard()}catch(e){m.textContent="Screenshot could not be saved. Please try another image."}}
function withdraw(){let m=document.getElementById("wmsg"),a=Number(document.getElementById("wamount").value),acc=document.getElementById("waccount").value.trim(),nm=document.getElementById("wname").value.trim();if(!user){m.textContent="Please log in first.";return}if(a<=0||!acc||!nm){m.textContent="Enter account holder name, account number, and amount.";return}requests.push({type:"Withdrawal",method:document.getElementById("wmethod").value,amount:a,account:acc,holder:nm,userEmail:user.email,userName:user.name,status:"Pending",date:new Date().toLocaleString()});saveRequests();m.textContent="Withdrawal request saved on this device only. No money has been transferred."}
function saveVideos(){videos=[1,2,3].map(i=>document.getElementById("v"+i).value.trim()).filter(Boolean).slice(0,3);localStorage.setItem(KEY+"_videos",JSON.stringify(videos));document.getElementById("vmsg").textContent="Video links saved on this device.";renderVideos()}
function renderVideos(){let box=document.getElementById("videoList");box.innerHTML=videos.length?videos.map((u,i)=>`<div class="taskrow"><b>Video Task ${i+1}</b><br><a href="${safeURL(u)}" target="_blank" rel="noopener" style="color:#8debd4;overflow-wrap:anywhere">Open video</a></div>`).join(""):"<p class='small'>No video links added yet.</p>";}
function safeURL(u){try{let x=new URL(u);return ["http:","https:"].includes(x.protocol)?x.href:"#"}catch(e){return "#"}}
function makeReferralLink(){if(!user)return "Login first to create your personal referral link.";let base=location.href.split("#")[0];return base+"?ref="+encodeURIComponent(user.email.split("@")[0].replace(/[^a-z0-9]/gi,"").toUpperCase());}
function refreshReferral(){let v=makeReferralLink();let a=document.getElementById("homeReferralLink");if(a)a.value=v;let b=document.getElementById("referralLinkValue");if(b)b.value=v;}
function copyReferral(){refreshReferral();let v=document.getElementById("homeReferralLink").value;if(!user){document.getElementById("homeReferralMsg").textContent="پہلے لاگ اِن کریں۔";return}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(()=>document.getElementById("homeReferralMsg").textContent="Referral link copied.").catch(()=>document.getElementById("homeReferralMsg").textContent=v)}else{document.getElementById("homeReferralLink").select();document.execCommand("copy");document.getElementById("homeReferralMsg").textContent="Referral link copied."}}
function renderDashboard(){
 let welcome=document.getElementById("dashWelcome"),bal=document.getElementById("dashBalance"),deps=document.getElementById("dashDeposits"),recent=document.getElementById("dashRecent");
 let amount=Number(user&&user.balance||0);bal.textContent="PKR "+amount.toFixed(2);document.getElementById("chartBalance").textContent="PKR "+amount.toFixed(2)+" Balance";
 if(!user){welcome.textContent="Your success is our priority. Keep going!";document.getElementById("dashTitle").textContent="Welcome Back, User!";deps.textContent="PKR 0.00";document.getElementById("topUser").textContent="User";recent.textContent="No requests yet.";return;}
 document.getElementById("dashTitle").textContent="Welcome Back, "+user.name+"!";document.getElementById("topUser").textContent=user.name;welcome.textContent="Your account is ready. Keep going!";
 let mine=requests.filter(r=>r.userEmail===user.email);let d=mine.filter(r=>r.type==="Deposit"&&String(r.status).startsWith("Approved")).reduce((a,r)=>a+Number(r.amount||0),0);deps.textContent="PKR "+Number(user.earnings||d).toFixed(2);
 recent.innerHTML=mine.length?"<table class='history'><tr><th>Type</th><th>Amount</th><th>Status</th><th>Date</th></tr>"+mine.slice(-5).reverse().map(r=>"<tr><td>"+escapeHTML(r.type)+"</td><td>PKR "+Number(r.amount||0).toFixed(2)+"</td><td>"+escapeHTML(r.status)+"</td><td>"+escapeHTML(r.date||"")+"</td></tr>").join("")+"</table>":"No requests yet.";
}
function renderProfile(){if(!user)return;document.getElementById("profileText").innerHTML="<b>"+escapeHTML(user.name)+"</b><br>"+escapeHTML(user.email);document.getElementById("pBalance").textContent="Rs. "+Number(user.balance||0).toFixed(2);document.getElementById("pEarn").textContent="Rs. "+Number(user.earnings||0).toFixed(2);document.getElementById("pDone").textContent=(user.done||[]).length;let h=document.getElementById("historyList");h.innerHTML=requests.length?"<table class='history'><tr><th>Type</th><th>Method</th><th>Amount</th><th>Status</th><th>Date</th></tr>"+requests.map(r=>"<tr><td>"+escapeHTML(r.type)+"</td><td>"+escapeHTML(r.method)+"</td><td>Rs. "+Number(r.amount).toFixed(2)+"</td><td>"+escapeHTML(r.status)+"</td><td>"+escapeHTML(r.date)+"</td></tr>").join("")+"</table>":"<p class='small'>No requests recorded on this device.</p>"}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
renderVideos();
renderDashboard();

function adminLogin(){let pin=document.getElementById("adminPin").value;if(pin!=="8426"){document.getElementById("adminMsg").textContent="Incorrect PIN.";return}ownerAdminUnlocked=true;document.getElementById("adminMenuLink").classList.remove("hidden");document.getElementById("adminLock").classList.add("hidden");document.getElementById("adminTools").classList.remove("hidden");renderAdmin()}
function adminLogout(){ownerAdminUnlocked=false;document.getElementById("adminMenuLink").classList.add("hidden");document.getElementById("adminTools").classList.add("hidden");document.getElementById("adminLock").classList.remove("hidden");document.getElementById("adminPin").value="";show("home")}
function adjustBalance(){let m=document.getElementById("balanceMsg"),change=Number(document.getElementById("balanceChange").value),reason=document.getElementById("balanceReason").value.trim();if(!user){m.textContent="اس براؤزر میں کوئی صارف اکاؤنٹ موجود نہیں۔";return}if(!Number.isFinite(change)||change===0||!reason){m.textContent="رقم میں تبدیلی اور وجہ درج کریں۔";return}if(Number(user.balance||0)+change<0){m.textContent="بیلنس صفر سے کم نہیں ہو سکتا۔";return}user.balance=Number(user.balance||0)+change;save();requests.push({type:"Admin balance adjustment",method:"Manual",amount:Math.abs(change),status:(change>0?"Added: "+reason:"Deducted: "+reason),date:new Date().toLocaleString(),userEmail:user.email,userName:user.name});saveRequests();m.textContent="اس ڈیوائس کے اکاؤنٹ کا بیلنس اپڈیٹ ہوگیا۔";document.getElementById("balanceChange").value="";document.getElementById("balanceReason").value="";renderAdmin();renderProfile();renderDashboard()}
function processRequest(i,action){let r=requests[i];if(!r||r.status!=="Pending")return;if(!user||r.userEmail!==user.email){alert("یہ درخواست موجودہ ڈیوائس کے لاگ اِن صارف سے متعلق نہیں ہے۔");return}if(action==="approve"&&r.type==="Deposit"){user.balance=Number(user.balance||0)+Number(r.amount);r.status="Approved — balance added";save()}else if(action==="complete"&&r.type==="Withdrawal"){if(Number(user.balance||0)<Number(r.amount)){alert("بیلنس کافی نہیں ہے۔ پہلے دستی طور پر ادائیگی اور بیلنس کی تصدیق کریں۔");return}user.balance=Number(user.balance||0)-Number(r.amount);r.status="Marked paid — balance deducted";save()}else{r.status="Rejected"}saveRequests();renderAdmin();renderProfile();renderDashboard()}
function renderAdmin(){let u=document.getElementById("adminUser");u.textContent=user?user.name+" • "+user.email+" • Balance: Rs. "+Number(user.balance||0).toFixed(2):"No account on this device.";let box=document.getElementById("adminRequests");if(!requests.length){box.innerHTML="<p class='small'>No requests saved in this browser.</p>";return}box.innerHTML=requests.map((r,i)=>`<div class="taskbox" style="margin:12px 0"><b>${escapeHTML(r.type)}</b><p class="small">User: ${escapeHTML(r.userName||"")} (${escapeHTML(r.userEmail||"")})<br>Amount: Rs. ${Number(r.amount||0).toFixed(2)}<br>Method: ${escapeHTML(r.method||"")}<br>Details: ${escapeHTML(r.reference||r.account||"")}<br>Screenshot file: ${escapeHTML(r.screenshotName||"Not saved") }<br>Status: ${escapeHTML(r.status)}<br>${escapeHTML(r.date||"")}</p>${r.screenshotData?`<b>Payment Screenshot:</b><img class="request-shot" src="${r.screenshotData}" alt="User payment screenshot">`:""}${r.status==="Pending"?`<button class="btn" onclick="processRequest(${i},'${r.type==='Deposit'?'approve':'complete'}')">${r.type==='Deposit'?'Approve & Add Balance':'Mark Paid & Deduct Balance'}</button> <button class="btn secondary" onclick="processRequest(${i},'reject')">Reject</button>`:""}</div>`).join("")}

</script>
</body></html>
